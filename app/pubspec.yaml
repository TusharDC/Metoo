name: shararat
description: Shararat — dating & chat app (Flutter + Supabase).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # backend
  supabase_flutter: ^2.5.6
  # state management
  flutter_riverpod: ^2.5.1
  # routing
  go_router: ^14.2.0
  # storage / media / misc
  flutter_secure_storage: ^9.2.2
  image_picker: ^1.1.2
  cached_network_image: ^3.3.1
  geolocator: ^12.0.0
  intl: ^0.19.0
  uuid: ^4.4.0
  cupertino_icons: ^1.0.8
  # AI companion media
  audioplayers: ^6.1.0
  video_player: ^2.9.2

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
