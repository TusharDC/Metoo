name: Build Android APK

# Builds an installable APK on GitHub's runners (this repo has no committed
# android/ folder — it is generated during the build).
#
# Run it from the Actions tab: "Build Android APK" -> "Run workflow".
# The APK lands in the run's Artifacts section as "shararat-apk".
on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      demo:
        description: "Demo build (no Supabase needed)"
        type: boolean
        default: true
      supabase_url:
        description: "Supabase URL (only for a live build)"
        required: false
      supabase_anon_key:
        description: "Supabase anon key (only for a live build)"
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      # Java 21, not 17: AGP's bundled lint calls List.removeLast(), which is a
      # Java 21 SequencedCollection API. On 17 it dies with NoSuchMethodError
      # while analysing image_picker_android.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show toolchain
        run: flutter --version

      # The android/ folder is gitignored, so generate it. lib/ is stashed
      # first because `flutter create` can overwrite template files.
      - name: Generate the Android platform folder
        run: |
          cp -a lib "$RUNNER_TEMP/lib-backup"
          cp -a pubspec.yaml "$RUNNER_TEMP/pubspec.yaml.backup"
          flutter create --platforms=android --org com.shararat --project-name shararat .
          rm -rf lib && cp -a "$RUNNER_TEMP/lib-backup" lib
          cp -a "$RUNNER_TEMP/pubspec.yaml.backup" pubspec.yaml

      # audioplayers/geolocator need a higher minSdk than the old default, and a
      # release build needs INTERNET declared in the main manifest.
      - name: Patch Android config
        run: |
          python3 - <<'PY'
          import re, pathlib
          g = pathlib.Path("android/app/build.gradle.kts")
          if not g.exists():
              g = pathlib.Path("android/app/build.gradle")
          s = g.read_text()
          s = re.sub(r'minSdk\s*=\s*[\w.]+', 'minSdk = 23', s)
          s = re.sub(r'minSdkVersion\s+[\w.]+', 'minSdkVersion 23', s)
          # A distinct applicationId so this installs alongside the real
          # Shararat from Play instead of being treated as an update to it
          # (which fails on signature mismatch).
          s = re.sub(r'applicationId\s*=\s*"[^"]+"', 'applicationId = "com.shararat.demo"', s)
          s = re.sub(r'applicationId\s+"[^"]+"', 'applicationId "com.shararat.demo"', s)
          g.write_text(s)
          print(f"patched {g}")

          # Lint adds nothing to a demo APK and its vital-release chain is a
          # common source of crashes in plugin modules. Turning it off on the
          # app also skips lintVitalAnalyzeRelease in every library module.
          if "checkReleaseBuilds" not in s:
              s += '\n\nandroid {\n    lint {\n        checkReleaseBuilds = false\n        abortOnError = false\n    }\n}\n'
              g.write_text(s)
              print("disabled release lint")

          m = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          x = m.read_text()
          # Distinct launcher label, so it is obvious which icon is the demo.
          x = re.sub(r'android:label="[^"]*"', 'android:label="Shararat Demo"', x, count=1)
          m.write_text(x)
          print("set launcher label")
          if "android.permission.INTERNET" not in x:
              x = x.replace("<manifest", '<manifest', 1)
              x = re.sub(r'(<manifest[^>]*>)',
                         r'\1\n    <uses-permission android:name="android.permission.INTERNET"/>',
                         x, count=1)
              m.write_text(x)
              print("added INTERNET permission")
          PY

      # path_provider_android and shared_preferences_android pull in
      # package:jni, which has native C++ and so forces an NDK download.
      # Pre-install it so the Gradle run doesn't stall fetching it.
      - name: Pre-install the Android NDK
        run: |
          NDK_VER=$(grep -oE 'ndkVersion\s*=\s*"[0-9.]+"' android/app/build.gradle.kts | grep -oE '[0-9.]+' || true)
          if [ -z "$NDK_VER" ]; then NDK_VER=28.2.13676358; fi
          echo "Installing NDK $NDK_VER"
          yes | sdkmanager --install "ndk;$NDK_VER" >/dev/null || \
            echo "sdkmanager could not pre-install the NDK; Gradle will fetch it"

      - name: Resolve dependencies
        run: flutter pub get

      - name: Static analysis (non-blocking)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Build APK
        run: |
          if [ "${{ inputs.demo }}" = "false" ]; then
            echo "Building LIVE (Supabase)"
            flutter build apk --release \
              --dart-define=SUPABASE_URL='${{ inputs.supabase_url }}' \
              --dart-define=SUPABASE_ANON_KEY='${{ inputs.supabase_anon_key }}'
          else
            echo "Building DEMO (no backend)"
            flutter build apk --release --dart-define=DEMO=true
          fi

      - name: Rename for clarity
        run: |
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-release.apk \
             out/shararat-${{ inputs.demo == 'false' && 'live' || 'demo' }}.apk
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: shararat-apk
          path: app/out/*.apk
          if-no-files-found: error
          retention-days: 30
