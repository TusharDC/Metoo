name: Deploy web to GitHub Pages

# Builds the Flutter web app in demo mode and publishes it to GitHub Pages.
#
# One-time setup in the repo: Settings -> Pages -> Build and deployment ->
# Source: "GitHub Actions". Then this runs on every push to main.
#
# The site lands at https://<owner>.github.io/<repo>/
on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      demo:
        description: "Demo build (offline fixtures, no Supabase)"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

env:
  # Set to the custom domain to serve the site at the root of it. Leave empty
  # to serve from https://<owner>.github.io/<repo>/ instead.
  CUSTOM_DOMAIN: ruderthanrude.com
  # Safe to keep in the repo: the publishable key is designed to ship in
  # clients and is constrained by row-level security. The secret key is not
  # here and never should be.
  SUPABASE_URL: https://qcoxiqtipxvntadztjbc.supabase.co
  SUPABASE_ANON_KEY: sb_publishable_DfT2a3laN9zB12c_pHIAbw_EMabrj0y

# Let a newer push supersede an in-flight deploy.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version

      - name: Resolve dependencies
        run: flutter pub get

      # With a custom domain the site is served from the root, so base href is
      # "/". Without one, Pages serves from /<repo>/ and the base href must
      # match or every asset 404s.
      - name: Build web
        run: |
          if [ -n "${CUSTOM_DOMAIN}" ]; then BASE="/"; else BASE="/${GITHUB_REPOSITORY#*/}/"; fi
          echo "base href: $BASE"
          # Live against Supabase unless a demo build was explicitly asked for.
          if [ "${{ inputs.demo }}" = "true" ]; then
            echo "building DEMO (no backend)"
            flutter build web --release --base-href "$BASE" --dart-define=DEMO=true
          else
            echo "building LIVE against ${SUPABASE_URL}"
            flutter build web --release --base-href "$BASE" \
              --dart-define=SUPABASE_URL="${SUPABASE_URL}" \
              --dart-define=SUPABASE_ANON_KEY="${SUPABASE_ANON_KEY}"
          fi

      # Pages' static host has no SPA rewrite; a copy of index.html as 404.html
      # makes deep links resolve to the app instead of a GitHub error page.
      - name: Add SPA fallback
        run: cp build/web/index.html build/web/404.html

      # Pages needs a CNAME file in the artifact or it drops the custom domain
      # on each deploy.
      - name: Write CNAME
        if: env.CUSTOM_DOMAIN != ''
        run: echo "${CUSTOM_DOMAIN}" > build/web/CNAME

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
